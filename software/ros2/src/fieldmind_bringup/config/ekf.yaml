# Localisation du rover (robot_localization), architecture de hardware/sensors/positionnement_gnss.md.
#
# - ekf_local : roues (compte-tours de l'essieu arrière + braquage commandé) et gyroscope.
#   Transformée odom → base_footprint, continue et sans saut : suivi de trajectoire, costmap locale.
# - navsat_transform : convertit le GNSS (ZED-F9P RTK) en positions dans le repère map, dont
#   l'origine est le premier point reçu, axes est/nord.
# - ekf_global : ekf_local + positions GNSS + cap de la centrale. Transformée map → odom.
#
# Sans ciel (bâtiment, sous-bois dense), lancer avec localisation:=slam (slam_toolbox publie alors
# map → odom à partir du lidar).
ekf_local:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom
    odom0: /odom_roues
    # x y z roulis tangage lacet vx vy vz vroulis vtangage vlacet ax ay az
    odom0_config: [false, false, false, false, false, false,
                   true,  true,  false, false, false, true,
                   false, false, false]
    odom0_differential: false
    imu0: /imu/data
    imu0_config: [false, false, false, false, false, false,
                  false, false, false, false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_remove_gravitational_acceleration: true

ekf_global:
  ros__parameters:
    frequency: 20.0
    sensor_timeout: 0.5
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: map
    odom0: /odom_roues
    odom0_config: [false, false, false, false, false, false,
                   true,  true,  false, false, false, true,
                   false, false, false]
    odom0_differential: false
    # Positions GNSS converties par navsat_transform.
    odom1: /odometry/gps
    odom1_config: [true,  true,  false, false, false, false,
                   false, false, false, false, false, false,
                   false, false, false]
    odom1_differential: false
    # Cap absolu (BNO085 en mode « rotation vector ») et vitesse de lacet.
    imu0: /imu/data
    imu0_config: [false, false, false, false, false, true,
                  false, false, false, false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_remove_gravitational_acceleration: true

navsat_transform:
  ros__parameters:
    frequency: 10.0
    delay: 1.0
    magnetic_declination_radians: 0.0
    yaw_offset: 0.0
    zero_altitude: true
    broadcast_cartesian_transform: false
    publish_filtered_gps: true
    use_odometry_yaw: false
    wait_for_datum: false
