# Pont Gazebo ↔ ROS 2. Côté ROS, les noms sont ceux des pilotes du rover réel : le reste de la
# pile (localisation, SLAM, Nav2, perception, agent) ne sait pas qu'elle tourne en simulation.
- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS
- ros_topic_name: /scan
  gz_topic_name: /rover/scan
  ros_type_name: sensor_msgs/msg/LaserScan
  gz_type_name: gz.msgs.LaserScan
  direction: GZ_TO_ROS
- ros_topic_name: /imu/data
  gz_topic_name: /rover/imu
  ros_type_name: sensor_msgs/msg/Imu
  gz_type_name: gz.msgs.IMU
  direction: GZ_TO_ROS
# Position GNSS exacte : le modèle du récepteur (recepteur_gnss) y ajoute l'erreur réaliste.
- ros_topic_name: /sim/gnss_exact
  gz_topic_name: /rover/navsat
  ros_type_name: sensor_msgs/msg/NavSatFix
  gz_type_name: gz.msgs.NavSat
  direction: GZ_TO_ROS
- ros_topic_name: /camera/image_raw
  gz_topic_name: /rover/camera/image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
- ros_topic_name: /camera/camera_info
  gz_topic_name: /rover/camera/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: gz.msgs.CameraInfo
  direction: GZ_TO_ROS
- ros_topic_name: /profondeur/depth
  gz_topic_name: /rover/profondeur/depth_image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
- ros_topic_name: /profondeur/points
  gz_topic_name: /rover/profondeur/points
  ros_type_name: sensor_msgs/msg/PointCloud2
  gz_type_name: gz.msgs.PointCloudPacked
  direction: GZ_TO_ROS
- ros_topic_name: /profondeur/camera_info
  gz_topic_name: /rover/profondeur/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: gz.msgs.CameraInfo
  direction: GZ_TO_ROS
# Matériel simulé : seul le contrôleur embarqué simulé les utilise (sur le rover réel, ce sont
# le VESC et le servo, pilotés par le MCU).
- ros_topic_name: /sim/joint_states
  gz_topic_name: /rover/joint_states
  ros_type_name: sensor_msgs/msg/JointState
  gz_type_name: gz.msgs.Model
  direction: GZ_TO_ROS
- ros_topic_name: /sim/roue_ar_g/cmd_vel
  gz_topic_name: /rover/roue_ar_g/cmd_vel
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ
- ros_topic_name: /sim/roue_ar_d/cmd_vel
  gz_topic_name: /rover/roue_ar_d/cmd_vel
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ
- ros_topic_name: /sim/braquage_g/cmd_pos
  gz_topic_name: /rover/braquage_g/cmd_pos
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ
- ros_topic_name: /sim/braquage_d/cmd_pos
  gz_topic_name: /rover/braquage_d/cmd_pos
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ
# Vérité terrain : évaluation et affichage de la simulation seulement, jamais lue par le cerveau.
- ros_topic_name: /sim/verite
  gz_topic_name: /model/rover/pose
  ros_type_name: geometry_msgs/msg/PoseStamped
  gz_type_name: gz.msgs.Pose
  direction: GZ_TO_ROS
