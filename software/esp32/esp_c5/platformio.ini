; Projet ESP du rover : ouvrir ce dossier dans VS Code avec PlatformIO.
[platformio]
default_envs = esp_c5

[env:esp_c5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = seeed_xiao_esp32c5
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
monitor_echo = yes
monitor_eol = LF
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DFIELDMIND_ROVER_COMPLET=1
    -DFIELDMIND_DUAL_MOTOR=1
build_src_filter =
    -<*>
    +<main.cpp>
    +<actionneurs.cpp>
    +<drone_wifi.cpp>
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit BusIO@^1.16.1
    madhephaestus/ESP32Servo@3.2.1

; Programme séparé pour UN moteur ; main.cpp n'est pas compilé dans ce mode.
[env:test_moteur]
extends = env:esp_c5
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DFIELDMIND_MOTOR_CONTROL=1
    -DFIELDMIND_MOTOR_ONLY=1
build_src_filter =
    -<*>
    +<test_moteur.cpp>
    +<moteur_zs_x11d1.cpp>

; Test servo seul, sans compiler le main ni la commande des moteurs.
[env:test_servo]
extends = env:esp_c5
build_flags = -DCORE_DEBUG_LEVEL=0
build_src_filter =
    -<*>
    +<test_servo.cpp>
lib_deps =
    madhephaestus/ESP32Servo@3.2.1

; Test manuel combine : servo D7 + deux drivers de traction D0/D9.
[env:test_tout_moteur]
extends = env:esp_c5
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DFIELDMIND_DUAL_MOTOR=1
build_src_filter =
    -<*>
    +<test_tout_moteur.cpp>
    +<actionneurs.cpp>
lib_deps =
    madhephaestus/ESP32Servo@3.2.1

; Alias du programme principal, avec deux moteurs et capteurs.
[env:esp_c5_complet]
extends = env:esp_c5

; Même source, sorties moteur non configurées : ancien programme capteurs.
[env:esp_c5_capteurs]
extends = env:esp_c5
build_flags = -DCORE_DEBUG_LEVEL=0
build_src_filter =
    -<*>
    +<main.cpp>
