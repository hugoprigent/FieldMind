# Pile ROS 2 du rover FieldMind, sur le GX10 ou sur le Pi (voir ../README.md et lancer.sh).
#
#   FIELDMIND_ROVER=rover.local:8080 FIELDMIND_JETON=… docker compose up -d ros2
#
# Réseau de l'hôte : Foxglove (port 8765) et DDS (RViz, outils ros2 d'autres machines) sont
# joignables directement. Les variables peuvent aussi être mises dans docker/.env.
name: fieldmind-ros2

x-commun: &commun
  image: fieldmind/rover-ros2:jazzy
  network_mode: host
  ipc: host

services:
  ros2:
    <<: *commun
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      FIELDMIND_ROVER: ${FIELDMIND_ROVER:-rover.local:8080}
      FIELDMIND_JETON: ${FIELDMIND_JETON:-}
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      # UDP seulement : la mémoire partagée de Fast DDS échoue entre conteneurs ou utilisateurs
      # différents (nœuds Nav2 bloqués à l'activation). Vide : transports par défaut.
      FASTDDS_BUILTIN_TRANSPORTS: ${FASTDDS_BUILTIN_TRANSPORTS:-UDPv4}
    command:
      - ros2
      - launch
      - fieldmind_rover_bringup
      - tout.launch.py
      - slam:=${SLAM:-true}
      - navigation:=${NAVIGATION:-true}
      - controleur:=${CONTROLEUR:-mppi}
      - images:=${IMAGES:-true}
      - foxglove:=${FOXGLOVE:-true}
      - port_foxglove:=${PORT_FOXGLOVE:-8765}

  # RViz sur l'écran de la machine (X11) : docker compose --profile rviz up rviz
  rviz:
    <<: *commun
    profiles: ["rviz"]
    environment:
      DISPLAY: ${DISPLAY:-:0}
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      FASTDDS_BUILTIN_TRANSPORTS: ${FASTDDS_BUILTIN_TRANSPORTS:-UDPv4}
      QT_X11_NO_MITSHM: "1"
      # Rendu logiciel : marche partout ; 0 pour essayer le GPU (pilote dans le conteneur requis).
      LIBGL_ALWAYS_SOFTWARE: ${LIBGL_ALWAYS_SOFTWARE:-1}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    command:
      - rviz2
      - -d
      - /ws/install/fieldmind_rover_bringup/share/fieldmind_rover_bringup/rviz/rover.rviz
