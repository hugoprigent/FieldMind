# Variante légère du contrôleur local (Raspberry Pi 4) : Regulated Pure Pursuit au lieu de MPPI.
# Chargé APRÈS nav2.yaml (navigation.launch.py controleur:=rpp) : remplace le greffon FollowPath.
# Courbure limitée par le chemin (Smac Hybrid-A*, rayon 0,80 m) ; pas de rotation sur place.

controller_server:
  ros__parameters:
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.40
      lookahead_dist: 0.8
      min_lookahead_dist: 0.5
      max_lookahead_dist: 1.5
      lookahead_time: 2.0
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 1.0
      min_approach_linear_velocity: 0.08
      approach_velocity_scaling_dist: 0.8
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 1.0
      regulated_linear_scaling_min_speed: 0.15
      use_fixed_curvature_lookahead: false
      allow_reversing: true  # rebroussements des chemins Reeds-Shepp
      use_rotate_to_heading: false  # Ackermann : jamais de rotation sur place
      max_angular_accel: 2.0
      max_robot_pose_search_dist: 10.0
      interpolate_curvature_after_goal: false
      cost_scaling_dist: 0.6
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 4.0
