# Nav2 (Jazzy) pour le rover FieldMind réel : Ackermann lent, sans codeurs de roue.
#
# Nav2 n'est qu'une SOURCE DE CONSIGNES : /cmd_vel part vers le rover par le pont, et le rover
# le fait passer par sa propre sécurité (lidar, stéréo, inclinaison, homme mort…) à 20 Hz. Il ne
# le suit qu'en mode `auto`, armé, sans mission en cours.
#
# Géométrie (software/rover/config/rover.toml) : empattement 0,38 m, braquage max 31° (roue
# intérieure en butée), emprise de x = −0,11 à +0,46 m, demi-largeur 0,225 m (0,57 × 0,45 m).
# base_link est au sol, au milieu de l'essieu arrière : c'est le point de référence du modèle
# Ackermann de Nav2 (Smac Hybrid-A*, MPPI).
#
# Rayon de braquage minimal : L / tan(31°) = 0,63 m si 31° est l'angle de la roue virtuelle
# centrale, mais 31° est la butée de la roue INTÉRIEURE : au milieu de l'essieu arrière,
# R = L / tan(31°) + voie avant / 2 ≈ 0,79 m. On planifie à 0,80 m : un chemin plus serré que ce
# que le rover sait faire serait impossible à suivre (servo pas encore calibré).
#
# Vitesse : 0,5 m/s au plus en autonome (vitesses.max_auto_m_s), 0,3 m/s en marche arrière.
# Odométrie : /odom du rover (recalage lidar + gyroscope), map → odom par slam_toolbox.

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    transform_tolerance: 1.0
    bt_loop_duration: 10
    default_server_timeout: 200
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    odom_topic: /odom
    controller_frequency: 10.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    enable_stamped_cmd_vel: false  # Twist, comme l'attend le pont
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      # Le rover peut ralentir ou s'arrêter de lui-même (sécurité, stéréo absente) : patience.
      movement_time_allowance: 15.0
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.30
      # Cap d'arrivée ignoré : l'atteindre exactement demande des manœuvres à un Ackermann.
      yaw_goal_tolerance: 6.28
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      motion_model: "Ackermann"
      AckermannConstraints:
        min_turning_r: 0.80
      time_steps: 40  # horizon 4 s : 2 m à 0,5 m/s
      model_dt: 0.1
      batch_size: 1000
      iteration_count: 1
      vx_std: 0.15
      vy_std: 0.0
      wz_std: 0.4
      vx_max: 0.5
      vx_min: -0.3
      vy_max: 0.0
      wz_max: 1.0
      ax_max: 0.6  # traction.rampe_acceleration_m_s2
      ax_min: -1.0
      az_max: 2.0
      prune_distance: 1.5
      transform_tolerance: 1.0  # map → odom suit les scans (≈ 10 Hz, traités à 5 Hz)
      temperature: 0.3
      gamma: 0.015
      visualize: false
      regenerate_noises: true
      enforce_path_inversion: true  # chemins Reeds-Shepp : suivre chaque rebroussement
      inversion_xy_tolerance: 0.2
      inversion_yaw_tolerance: 0.4
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic",
                "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic: {enabled: true, cost_power: 1, cost_weight: 4.0}
      GoalCritic: {enabled: true, cost_power: 1, cost_weight: 5.0, threshold_to_consider: 1.2}
      GoalAngleCritic: {enabled: true, cost_power: 1, cost_weight: 3.0, threshold_to_consider: 0.5}
      PreferForwardCritic: {enabled: true, cost_power: 1, cost_weight: 8.0, threshold_to_consider: 0.5}
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        near_collision_cost: 253
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 0.8
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: true
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.2
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 1

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 1.0
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      footprint: "[[0.46, 0.225], [0.46, -0.225], [-0.11, -0.225], [-0.11, 0.225]]"
      footprint_padding: 0.03
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          # Plan laser à 0,322 m : un obstacle plus bas est invisible ici (la stéréo du rover
          # le voit, sa sécurité s'en charge).
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          marking: true
          clearing: true
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          # Secteurs sans écho (+inf) : ni marqués ni effacés (ils comprennent aussi les
          # secteurs masqués par le rover, derrière lesquels le lidar ne voit pas).
          inf_is_valid: false
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.60  # ≥ rayon circonscrit (0,51 m) : contrôle d'emprise exact
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 1.0
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[0.46, 0.225], [0.46, -0.225], [-0.11, -0.225], [-0.11, 0.225]]"
      footprint_padding: 0.03
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true  # /map de slam_toolbox
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          marking: true
          clearing: true
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          inf_is_valid: false
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.70
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: "nav2_smac_planner::SmacPlannerHybrid"
      # Recherche sur une grille de 0,10 m (costmap de 0,05 m) : assez fin pour un rover de
      # 0,45 m de large, quatre fois moins de cellules (le Pi 4 suit).
      downsample_costmap: true
      downsampling_factor: 2
      tolerance: 0.30
      allow_unknown: true  # l'inconnu se traverse (planification optimiste, corrigée en roulant)
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 3.0
      motion_model_for_search: "REEDS_SHEPP"  # marche arrière permise, pénalisée
      angle_quantization_bins: 72
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      analytic_expansion_max_cost: 200.0
      analytic_expansion_max_cost_override: false
      minimum_turning_radius: 0.80
      reverse_penalty: 3.0
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      debug_visualizations: false
      use_quadratic_cost_penalty: false
      downsample_obstacle_heuristic: true
      allow_primitive_interpolation: false
      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
        refinement_num: 2

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    # Pas de rotation sur place (Spin) : impossible pour un Ackermann.
    behavior_plugins: ["backup", "drive_on_heading", "wait"]
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 1.0
    simulate_ahead_time: 2.0
    enable_stamped_cmd_vel: false

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    # Même facteur sur v et ω : la courbure (donc le braquage) est conservée.
    scale_velocities: true
    feedback: "OPEN_LOOP"
    max_velocity: [0.5, 0.0, 1.0]
    min_velocity: [-0.3, 0.0, -1.0]
    max_accel: [0.6, 0.0, 1.5]
    max_decel: [-1.0, 0.0, -1.5]
    odom_topic: "/odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    # Sans consigne de Nav2 pendant 0,5 s : un zéro, puis plus rien (le rover s'arrête de
    # lui-même si plus rien n'arrive).
    velocity_timeout: 0.5
    enable_stamped_cmd_vel: false

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 0
