# Profil du rover FieldMind (prototype final, 18 octobre 2026).
#
# Géométrie : CAO de la direction V04 et du prototype final (cao/), pas encore mesurée sur le rover.
# Les valeurs marquées « à calibrer » se règlent depuis le poste (menu Réglages > Calibration) ;
# le résultat est enregistré dans ~/.config/fieldmind/reglages.json, qui a priorité sur ce fichier.
#
# Repère base_link : origine au sol au milieu de l'essieu arrière (axe des moteurs, sous le
# lidar), x vers l'avant, y vers la gauche, z vers le haut.

[geometrie]
empattement_m = 0.38          # pivots avant -> axe des moteurs arrière (d4_empattement)
voie_arriere_m = 0.39         # entre les milieux des roues arrière
voie_avant_m = 0.31           # entre les pivots avant (d4_E)
diametre_roue_arriere_m = 0.200
diametre_roue_avant_m = 0.150
braquage_max_deg = 31.0       # roue intérieure en butée (CAO V04)
# Emprise au sol (rectangle englobant, roues comprises) : x de l'arrière à l'avant, y demi-largeur
emprise_arriere_m = -0.11     # roues arrière Ø200 sur l'axe
emprise_avant_m = 0.46        # nez de la coque et barre des caméras
emprise_demi_largeur_m = 0.225
hauteur_max_m = 0.36          # haut du lidar
masse_kg = 5.8

[lidar]
modele = "RPLIDAR C1"
x_m = 0.0
y_m = 0.0
z_m = 0.322                   # plan laser à 322 mm du sol
decalage_deg = 0.0            # 0° du lidar (opposé au câble) vers l'avant du rover
sens_horaire = true           # angles du RPLIDAR croissants dans le sens horaire vu de dessus
portee_min_m = 0.12
portee_max_m = 12.0
debit_bauds = 460800
masque_marge_m = 0.05         # points ignorés jusqu'à 5 cm autour de l'emprise (le rover lui-même)

[cameras]
largeur = 1280
hauteur = 720
ips = 15
base_m = 0.120                # écart des centres optiques (barre stéréo)
x_m = 0.415                   # centres optiques, en avant de l'essieu arrière
z_m = 0.265                   # hauteur des centres optiques
inclinaison_deg = 10.0        # vers le sol
hfov_deg = 78.0               # valeur par défaut tant que la calibration stéréo n'est pas faite
# Attribution gauche/droite par port USB (/dev/v4l/by-path). Vide : ordre des ports, réglable
# depuis le poste (Réglages > Caméras > Inverser).
port_gauche = ""
port_droite = ""
calibration = "~/.config/fieldmind/stereo.npz"   # produite par l'outil de calibration du poste

[imu]
# Axes du MPU-6050 de la carte A7 vers base_link : "x", "-x", "y", "-y", "z", "-z" (à calibrer).
axe_x = "x"
axe_y = "y"
axe_z = "z"

[gnss]
x_m = 0.20                    # antenne, dans base_link
y_m = -0.10
tolerance_m = 2.5             # un but GPS est atteint à cette distance (GPS à 2–3 m)
hdop_max = 5.0                # points GPS plus imprécis ignorés
alignement_etendue_m = 6.0    # trajet nécessaire pour orienter l'odométrie sur le nord
alignement_residu_max_m = 4.0
fenetre_s = 300.0             # mémoire du recalage odométrie ↔ GPS
# reference_lat = 43.7102     # facultatif : origine du plan local (sinon le premier point GPS)
# reference_lon = -1.0536

[esp]
debit_bauds = 115200
chien_de_garde_ms = 400       # demandé au firmware s'il le gère (ROVER_3 et suivants)
periode_commande_s = 0.05     # 20 Hz
moteurs_permutes = false      # moteur gauche branché sur la sortie droite (et l'inverse)
sens_inverse = false          # les deux moteurs tournent à l'envers (avancer fait reculer)

[traction]
# Correspondance pourcentage PWM -> vitesse (à calibrer : Réglages > Calibration > Vitesse).
pwm_par_m_s = 35.0            # % de PWM pour 1 m/s en régime établi
pwm_seuil = 4                 # % sous lequel le moteur ne tourne pas (zone morte)
pwm_max = 100                 # plafond absolu envoyé à l'ESP, tous modes sauf banc
pwm_max_banc = 15
delai_inversion_s = 0.6       # roue à zéro avant de changer son sens (arrêt physique)
rampe_acceleration_m_s2 = 0.6
differentiel = true           # roue intérieure plus lente en virage (controle/differentiel.py)
boucle_lacet = true           # correction du différentiel par le gyroscope (firmware ROVER_3)
lacet_kp = 0.8
lacet_ki = 0.6
lacet_correction_max_m_s = 0.10
equilibre_d = 1.0             # gain du moteur droit par rapport au gauche (à calibrer)

[roues]
# Sorties SC des drivers (impulsions Hall) sur D2/D3 de l'ESP, firmware « roues 1 ».
# 0 : pas de capteurs câblés. Se calibre avec la calibration Vitesse (lidar).
capteurs = false
impulsions_par_metre = 0.0

[direction]
# Angle du servo (échelle indicative du firmware, -90..+90) pour un braquage de roue donné.
servo_par_degre_roue = 1.0    # à calibrer : Réglages > Calibration > Braquage
servo_neutre_deg = 0.0        # trim : servo pour rouler droit
servo_max_deg = 40.0          # butée logicielle
servo_vitesse_deg_s = 150.0   # vitesse de consigne envoyée au firmware (commande v)
# Direction par les roues arrière (servo absent ou hors service, roues avant laissées libres) :
# le braquage demandé devient une différence de vitesse des deux moteurs (même géométrie).
par_l_arriere = false
gain_arriere = 1.0            # > 1 : virages plus serrés que la géométrie (manuel surtout)
vitesse_pivot_m_s = 0.2       # rotation sur place, joystick sur le côté à l'arrêt (manuel)

[vitesses]
max_manuel_m_s = 0.8
max_auto_m_s = 0.5
max_arriere_m_s = 0.3
defaut_action_m_s = 0.35
max_suivi_m_s = 0.6           # suivre une personne (plafonné aussi par max_auto_m_s)

[securite]
deceleration_m_s2 = 0.8       # freinage supposé (roues libres, pas de frein mécanique)
latence_s = 0.25              # mesure -> commande -> moteur
marge_avant_m = 0.15          # en plus de la distance de freinage
marge_laterale_m = 0.06
distance_arret_absolu_m = 0.20  # plus près que ça du nez : on n'avance plus, même au pas
lidar_perime_s = 0.5
stereo_perimee_s = 1.0
inclinaison_max_deg = 25.0
consigne_manuelle_perimee_s = 0.5
blocage_s = 2.5               # consigne de mouvement sans déplacement mesuré
choc_g = 1.6                  # pic d'accélération horizontale
perte_operateur_s = 5.0       # sans poste connecté : arrêt en manuel (les missions continuent)
geofence_m = 60.0             # distance maximale au point de départ en mode auto
exiger_stereo_en_auto = false # true : pas de mode auto sans profondeur caméra
vitesse_sans_stereo_m_s = 0.3 # plafond quand la stéréo manque (obstacles bas invisibles au lidar)
vitesse_pres_personne_m_s = 0.25  # personne ou animal détecté devant (< 4 m), si détecteur
vitesse_sans_anticollision_m_s = 0.3  # manuel avec l'anticollision coupée (bouton du poste)
stereo_bloquante = false      # true : la stéréo arrête aussi ; false : seul le lidar arrête
vitesse_obstacle_bas_m_s = 0.25  # plafond quand la stéréo voit un obstacle bas (non bloquante)
frein_urgence = false         # utiliser la broche BRAKE (polarité à vérifier sur le montage)

[perception]
stereo_active = true
stereo_largeur = 640          # images réduites pour SGBM
stereo_ips = 4
obstacle_hauteur_min_m = 0.06 # au-dessus du sol estimé
obstacle_hauteur_max_m = 0.60
portee_stereo_m = 4.0

# Mire de calibration stéréo : damier imprimé, coins intérieurs et taille d'une case
mire_colonnes = 9
mire_lignes = 6
mire_case_m = 0.025
stereo_disparites = 128       # portée proche : 128 px à 640 px de large ≈ 0,45 m
portee_trou_m = 3.0
trou_profondeur_m = 0.10

[odometrie]
# Recalage lidar (ICP) contre des images clés, gyroscope, a priori de la commande
portee_max_m = 10.0
qualite_min = 0.35            # sous ce score, repli sur gyroscope + commande
images_cles = 12
distance_image_cle_m = 0.25
angle_image_cle_deg = 8.0
utiliser_lacet_esp = true     # lacet intégré par l'ESP (ROVER_3)
icp_iterations = 20

[cartographie]
resolution_m = 0.05
taille_m = 40.0
portee_libre_m = 8.0

[navigation]
# Planificateur (Dijkstra/A* sur la carte gonflée) et pilote local (arcs Ackermann)
resolution_m = 0.10
marge_m = 0.10
distance_confort_m = 0.8
penalite_inconnu = 0.5        # l'inconnu est traversable, un peu pénalisé
penalite_indicatif = 3.0      # coût des amas stéréo non bloquants dans le chemin global
poids_indicatifs = 2.0       # préférence locale pour les arcs les moins encombrés par la stéréo
arcs = 21
horizon_m = 2.0
tolerance_arrivee_m = 0.20
vitesse_min_m_s = 0.12
vitesse_recul_m_s = 0.15
distance_recul_m = 0.4
recul_direct_max_m = 1.5      # but derrière et plus près que ça : on y va en marche arrière

[capteurs]
# Interrupteurs du poste (Réglages > Capteurs actifs). La sécurité s'adapte : sans lidar le rover
# ne roule pas (sauf au banc), sans stéréo il ralentit.
lidar = true
camera_gauche = true
camera_droite = true
gnss = true
imu = true

[remorque]
# Remorque porte-drone (cao/prototype_final/remorque), facultative : à déclarer dans le poste
# (Réglages > Remorque). Cotes de la CAO, depuis la vis d'attelage.
attelee = false
attelage_m = 0.16             # essieu arrière du rover -> vis d'attelage (100 mm derrière la planche)
timon_m = 0.31                # vis d'attelage -> essieu de la remorque
avant_m = 0.10                # vis d'attelage -> bord avant de la planche
arriere_m = 0.48              # vis d'attelage -> bord arrière (planche de 380 mm)
demi_largeur_m = 0.19         # roues comprises, volets repliés
demi_largeur_volets_m = 0.265 # volets dépliés (à éviter en roulant)
volets_deplies = false
# Servos des volets sur D2 (gauche) et D3 (droit) de l'ESP, firmware ROVER_4 : servos à
# ROTATION CONTINUE (l'impulsion règle la vitesse ; 90 = arrêt). Déplier / replier = tourner
# dans un sens à `volets_vitesse` % pendant le temps de faire `volets_angle_deg`, d'après
# `volets_tours_min` (vitesse réelle à fond, à ajuster : volet trop loin -> augmenter), puis arrêt.
volets_vitesse = 40
volets_angle_deg = 90
volets_tours_min = 100.0
volet_g_inverse = false
volet_d_inverse = true        # monté en miroir
angle_contact_deg = 52.0      # au-delà, le coin avant touche une roue arrière du rover (CAO)
angle_max_arriere_deg = 20.0  # en reculant : au-delà, on ne peut plus la redresser en reculant
incertitude_max_recul_deg = 8.0   # angle estimé moins sûr : marche arrière refusée
masse_kg = 2.2                # remorque et drone : allonge le freinage (roues libres)
vitesse_max_m_s = 0.4
vitesse_max_arriere_m_s = 0.12
marche_arriere_auto = false   # missions et pilote automatique : jamais de marche arrière

[audio]
# Micro d'une webcam (ALSA). Vide : première carte de capture USB trouvée.
peripherique = ""
frequence_hz = 16000

[ia]
gx10_cartographie = true      # image régulière + carte sémantique, calculs de vision sur le GX10
gx10_periode_s = 3.0          # intervalle visé ; une seule analyse en vol, pas de file d'images
vigilance = false             # analyse IA automatique des images : une requête payante par image
vigilance_periode_s = 12.0    # à l'arrêt ; trois fois plus souvent quand le rover bouge
detection_continue = true     # GX10 : personnes et animaux, toutes les detection_periode_s
detection_periode_s = 2.5     # une image de 416 px (≈ 15 ko) par période
detection_seuil = 0.45
voix_rover = true             # GX10 : les réponses du rover sont dites par Qwen3-TTS

[enregistrement]
actif = true                  # boîte noire ~/fieldmind/enregistrements (python -m fieldmind.enregistreur)

[serveur]
hote = "0.0.0.0"
port = 8080
# Jeton facultatif (variable FIELDMIND_JETON) : sans lui, réseau local de confiance seulement.

[conduite]
armer_auto = false            # true : armé dès qu'on passe en manuel ou auto (sans le bouton)
