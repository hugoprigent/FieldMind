<!doctype html>
<html lang="fr" data-theme="sombre">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d10">
  <title>FieldMind — vue 3D</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    :root {
      color-scheme: dark;
      --fond: #0b0d10;
      --surface-2: #1b1f26;
      --bordure: #2b313b;
      --texte-1: #f2f4f7;
      --texte-2: #b8c0cb;
      --accent: #4ea8f2;
      --accent-voile: rgba(78, 168, 242, 0.22);
      --police: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--fond); color: var(--texte-1); font: 14px/1.4 var(--police); }
    body { height: 100dvh; overflow: hidden; -webkit-tap-highlight-color: transparent; }
    #vue { position: absolute; inset: 0; }
    .cameras {
      position: absolute; right: max(12px, env(safe-area-inset-right)); bottom: max(12px, env(safe-area-inset-bottom));
      display: flex; gap: 2px; padding: 3px; border-radius: 999px;
      background: rgba(19, 22, 27, 0.78); border: 1px solid var(--bordure);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    }
    .cameras button {
      display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px 7px 10px;
      border: 0; border-radius: 999px; background: transparent; color: var(--texte-2);
      font: 600 12px var(--police); cursor: pointer;
    }
    .cameras button[aria-pressed="true"] { background: var(--accent-voile); color: var(--texte-1); }
    .cameras button[aria-pressed="true"] svg { color: var(--accent); }
    .cameras button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .cameras svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    #ips {
      position: absolute; left: 12px; top: 12px; padding: 3px 8px; border-radius: 6px;
      background: rgba(19, 22, 27, 0.7); color: var(--texte-2); font: 11px var(--mono);
    }
  </style>
  <script type="module" src="js/vue3d/demo.js"></script>
</head>
<body>
  <div id="vue"></div>
  <div class="cameras" role="group" aria-label="Caméra">
    <button type="button" data-camera="suivie" aria-pressed="true">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19 12 5l7 14"/><path d="M8.5 13h7"/></svg><span>Suivie</span>
    </button>
    <button type="button" data-camera="dessus" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 8v8M9 11l3-3 3 3"/></svg><span>Dessus</span>
    </button>
    <button type="button" data-camera="libre" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="12" rx="9" ry="4"/><path d="M12 3a9 9 0 0 1 0 18"/><circle cx="12" cy="12" r="1.5"/></svg><span>Libre</span>
    </button>
  </div>
  <div id="ips" hidden></div>
</body>
</html>
