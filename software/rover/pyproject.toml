[project]
name = "fieldmind-rover"
version = "1.0.0"
description = "Logiciel embarqué du rover FieldMind (Raspberry Pi 4) et poste opérateur web."
requires-python = ">=3.13"

# Dépendances d'exécution : paquets apt du Pi (python3-numpy, python3-scipy, python3-opencv,
# python3-serial, python3-aiohttp). Développement : voir README.md.

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".venv", "fieldmind/web/vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM105", "RUF046"]
