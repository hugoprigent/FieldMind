<svg xmlns="http://www.w3.org/2000/svg" width="210.0mm" height="297.0mm" viewBox="0 0 210.0 297.0"><rect width="210.0" height="297.0" fill="white"/><text x="15.00" y="16.00" font-size="5.00" text-anchor="start" font-weight="bold" fill="#222" font-family="Helvetica, Arial, sans-serif">Support des 2 XL4015 — gabarit à l'échelle 1</text><text x="15.00" y="22.00" font-size="3.00" text-anchor="start" font-weight="normal" fill="#555" font-family="Helvetica, Arial, sans-serif">Imprimer à 100 % et vérifier la règle de 50 mm. Poser chaque module sur son contour, IN en bas.</text><text x="15.00" y="27.00" font-size="3.00" text-anchor="start" font-weight="normal" fill="#555" font-family="Helvetica, Arial, sans-serif">Ses deux trous doivent tomber sur les croix. Sinon, mesurer A et B (voir en bas) et me les donner.</text><polygon points="57.00,148.00 114.00,148.00 114.00,70.00 57.00,70.00" fill="#f4f4f4" stroke="#999" stroke-width="0.3"/><rect x="60.00" y="82.00" width="23.00" height="54.00" fill="none" stroke="#1f6fb2" stroke-width="0.4"/><text x="71.50" y="133.00" font-size="3.00" text-anchor="middle" font-weight="bold" fill="#1f6fb2" font-family="Helvetica, Arial, sans-serif">IN</text><text x="71.50" y="86.50" font-size="3.00" text-anchor="middle" font-weight="bold" fill="#1f6fb2" font-family="Helvetica, Arial, sans-serif">OUT</text><text x="71.50" y="109.00" font-size="2.80" text-anchor="middle" font-weight="normal" fill="#1f6fb2" font-family="Helvetica, Arial, sans-serif">Pi 5,1 V</text><rect x="88.00" y="82.00" width="23.00" height="54.00" fill="none" stroke="#1f6fb2" stroke-width="0.4"/><text x="99.50" y="133.00" font-size="3.00" text-anchor="middle" font-weight="bold" fill="#1f6fb2" font-family="Helvetica, Arial, sans-serif">IN</text><text x="99.50" y="86.50" font-size="3.00" text-anchor="middle" font-weight="bold" fill="#1f6fb2" font-family="Helvetica, Arial, sans-serif">OUT</text><text x="99.50" y="109.00" font-size="2.80" text-anchor="middle" font-weight="normal" fill="#1f6fb2" font-family="Helvetica, Arial, sans-serif">servo 6 V</text><circle cx="62.000" cy="126.600" r="1.500" fill="none" stroke="#c0392b" stroke-width="0.3"/><line x1="58.500" y1="126.600" x2="65.500" y2="126.600" stroke="#c0392b" stroke-width="0.3"/><line x1="62.000" y1="123.100" x2="62.000" y2="130.100" stroke="#c0392b" stroke-width="0.3"/><circle cx="81.000" cy="91.400" r="1.500" fill="none" stroke="#c0392b" stroke-width="0.3"/><line x1="77.500" y1="91.400" x2="84.500" y2="91.400" stroke="#c0392b" stroke-width="0.3"/><line x1="81.000" y1="87.900" x2="81.000" y2="94.900" stroke="#c0392b" stroke-width="0.3"/><circle cx="90.000" cy="126.600" r="1.500" fill="none" stroke="#c0392b" stroke-width="0.3"/><line x1="86.500" y1="126.600" x2="93.500" y2="126.600" stroke="#c0392b" stroke-width="0.3"/><line x1="90.000" y1="123.100" x2="90.000" y2="130.100" stroke="#c0392b" stroke-width="0.3"/><circle cx="109.000" cy="91.400" r="1.500" fill="none" stroke="#c0392b" stroke-width="0.3"/><line x1="105.500" y1="91.400" x2="112.500" y2="91.400" stroke="#c0392b" stroke-width="0.3"/><line x1="109.000" y1="87.900" x2="109.000" y2="94.900" stroke="#c0392b" stroke-width="0.3"/><circle cx="85.500" cy="142.500" r="1.700" fill="none" stroke="#555" stroke-width="0.3"/><line x1="81.800" y1="142.500" x2="89.200" y2="142.500" stroke="#555" stroke-width="0.3"/><line x1="85.500" y1="138.800" x2="85.500" y2="146.200" stroke="#555" stroke-width="0.3"/><circle cx="85.500" cy="75.500" r="1.700" fill="none" stroke="#555" stroke-width="0.3"/><line x1="81.800" y1="75.500" x2="89.200" y2="75.500" stroke="#555" stroke-width="0.3"/><line x1="85.500" y1="71.800" x2="85.500" y2="79.200" stroke="#555" stroke-width="0.3"/><text x="15.00" y="160.00" font-size="3.00" text-anchor="start" font-weight="normal" fill="#222" font-family="Helvetica, Arial, sans-serif">Circuit 23 × 54 mm, 2 trous Ø3 en diagonale :</text><text x="15.00" y="165.50" font-size="3.00" text-anchor="start" font-weight="normal" fill="#222" font-family="Helvetica, Arial, sans-serif">- trou côté IN : 2 mm du bord gauche, 9,4 mm du bout IN ;</text><text x="15.00" y="171.00" font-size="3.00" text-anchor="start" font-weight="normal" fill="#222" font-family="Helvetica, Arial, sans-serif">- trou côté OUT : 2 mm du bord droit, 9,4 mm du bout OUT ;</text><text x="15.00" y="176.50" font-size="3.00" text-anchor="start" font-weight="normal" fill="#222" font-family="Helvetica, Arial, sans-serif">- A = entraxe en longueur : 35,2 mm ; B = entraxe en largeur : 19 mm.</text><text x="15.00" y="182.00" font-size="3.00" text-anchor="start" font-weight="normal" fill="#222" font-family="Helvetica, Arial, sans-serif">Écart entre les deux circuits : 5 mm. Plots de 3,6 mm ; vis M3×8 par le dessus, écrou M3 dans la poche sous la plaque.</text><text x="15.00" y="187.50" font-size="3.00" text-anchor="start" font-weight="normal" fill="#222" font-family="Helvetica, Arial, sans-serif">Croix grises : fixation de la plaque sur la planche (vis M3×12 + rondelle + écrou, foret 4 dans la planche).</text><line x1="15" y1="199.0" x2="65" y2="199.0" stroke="#222" stroke-width="0.4"/><line x1="15.0" y1="197.0" x2="15.0" y2="199.0" stroke="#222" stroke-width="0.3"/><line x1="25.0" y1="197.0" x2="25.0" y2="199.0" stroke="#222" stroke-width="0.3"/><line x1="35.0" y1="197.0" x2="35.0" y2="199.0" stroke="#222" stroke-width="0.3"/><line x1="45.0" y1="197.0" x2="45.0" y2="199.0" stroke="#222" stroke-width="0.3"/><line x1="55.0" y1="197.0" x2="55.0" y2="199.0" stroke="#222" stroke-width="0.3"/><line x1="65.0" y1="197.0" x2="65.0" y2="199.0" stroke="#222" stroke-width="0.3"/><text x="70.00" y="200.00" font-size="3.00" text-anchor="start" font-weight="normal" fill="#222" font-family="Helvetica, Arial, sans-serif">règle de contrôle : 50 mm</text></svg>