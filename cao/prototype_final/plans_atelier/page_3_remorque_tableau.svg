t-anchor="start" font-weight="normal" fill="#222" font-family="Helvetica, Arial, sans-serif">Perçage : avant-trou au foret 2 ou 3, planche sur une cale martyre, puis le foret de la couleur. Aucun fraisage.</text><text x="15.00" y="121.00" font-size="2.90" text-anchor="start" font-weight="normal" fill="#222" font-family="Helvetica, Arial, sans-serif">Vis par le dessus à tête bombée (M3×16 et M6×16) : la tête reste posée sur le bois.</text><text x="15.00" y="126.00" font-size="2.90" text-anchor="start" font-weight="normal" fill="#222" font-family="Helvetica, Arial, sans-serif">T : timon (vis par-dessous). R : rebords. S : supports de roue. F : boîtiers des servos et blocs arrière.</text><text x="15.00" y="131.00" font-size="2.90" text-anchor="start" font-weight="normal" fill="#222" font-family="Helvetica, Arial, sans-serif">Gabarit à l'échelle 1 : plan_planche/plan_planche.pdf, pages 3 à 6.</text></svg>