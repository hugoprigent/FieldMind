ll="#222" font-family="Helvetica, Arial, sans-serif">- 2 trous aux mêmes distances du bord, à 10 mm du bout ARRIÈRE (ferrure arrière, axe M3).</text><text x="15.00" y="262.75" font-size="3.00" text-anchor="start" font-weight="normal" fill="#222" font-family="Helvetica, Arial, sans-serif">Le bord côté charnière (trait épais) est celui qui longe la planche. Volets vus comme sur la remorque, avant en haut.</text><text x="15.00" y="268.25" font-size="3.00" text-anchor="start" font-weight="normal" fill="#222" font-family="Helvetica, Arial, sans-serif">Vis M3×16 à tête bombée par le dessus, écrous noyés sous les ferrures. Aucun fraisage.</text><circle cx="17.00" cy="275.75" r="1.6" fill="#1f6fb2"/><text x="21.00" y="276.75" font-size="3.00" text-anchor="start" font-weight="bold" fill="#1f6fb2" font-family="Helvetica, Arial, sans-serif">FORET 4 — vis M3 : 8 trous</text></svg>