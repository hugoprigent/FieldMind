e cx="17.00" cy="160.00" r="1.6" fill="#16a085"/><text x="21.00" y="161.00" font-size="3.00" text-anchor="start" font-weight="bold" fill="#16a085" font-family="Helvetica, Arial, sans-serif">FORET 7 — vis M6 : 12 trous</text><circle cx="17.00" cy="165.50" r="1.6" fill="#9a7d0a"/><text x="21.00" y="166.50" font-size="3.00" text-anchor="start" font-weight="bold" fill="#9a7d0a" font-family="Helvetica, Arial, sans-serif">FORET 9 — vis M8 : 16 trous</text><circle cx="17.00" cy="171.00" r="1.6" fill="#e67e22"/><text x="21.00" y="172.00" font-size="3.00" text-anchor="start" font-weight="bold" fill="#e67e22" font-family="Helvetica, Arial, sans-serif">FORET 8 — passage de câble : 1 trou</text><text x="15.00" y="180.50" font-size="2.90" text-anchor="start" font-weight="normal" fill="#222" font-family="Helvetica, Arial, sans-serif">Tous les trous vont par paires symétriques, sauf C1 et le servo (sur l'axe, X = 150).</text><text x="15.00" y="185.50" font-size="2.90" text-anchor="start" font-weight="normal" fill="#222" font-family="Helvetica, Arial, sans-serif">P : supports de pivot. M : supports moteurs. E : équerres des mâts. S : oreilles du servo (pointer avec le servo).</text><text x="15.00" y="190.50" font-size="2.90" text-anchor="start" font-weight="normal" fill="#222" font-family="Helvetica, Arial, sans-serif">K : coque. A : chape d'attelage. B : berceau de batterie. X : plaque des XL4015. C : câble des volets de la remorque.</text><text x="15.00" y="195.50" font-size="2.90" text-anchor="start" font-weight="normal" fill="#222" font-family="Helvetica, Arial, sans-serif">Découpe du servo : percer un trou dans chaque coin, puis scier entre les trous et limer.</text><text x="15.00" y="200.50" font-size="2.90" text-anchor="start" font-weight="normal" fill="#222" font-family="Helvetica, Arial, sans-serif">Gabarit à l'échelle 1 : plan_percages/plan_percages.pdf, pages 3 à 6.</text></svg>